# =============================================================================
#  ntfy (notificaciones push al celular) — recurso "Docker Compose" de Coolify
#
#  - NO publica puertos. En Coolify → servicio "ntfy" → Domains:  https://ntfy.tudominio.com:80
#  - Nadie puede leer ni publicar sin usuario/token (deny-all).
# =============================================================================
services:
  ntfy:
    image: binwiederhier/ntfy:v2.31.0
    restart: unless-stopped
    command: serve
    expose:
      - "80"
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - NTFY_BASE_URL=https://${NTFY_HOST:?ntfy.tudominio.com}
      - NTFY_BEHIND_PROXY=true
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
      - NTFY_AUTH_FILE=/var/lib/ntfy/user.db
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
      - NTFY_ATTACHMENT_CACHE_DIR=/var/cache/ntfy/attachments
      - NTFY_ENABLE_LOGIN=true
      - NTFY_UPSTREAM_BASE_URL=https://ntfy.sh   # notificaciones instantáneas en iPhone
    volumes:
      - ntfy_cache:/var/cache/ntfy
      - ntfy_lib:/var/lib/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -q healthy"]
      interval: 60s
      timeout: 10s
      retries: 3

volumes:
  ntfy_cache:
  ntfy_lib:
