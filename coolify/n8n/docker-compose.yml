# =============================================================================
#  n8n + su base de datos — recurso "Docker Compose" de Coolify
#
#  - NO publica puertos: Traefik (Coolify) pone el dominio y el SSL.
#    En Coolify → este recurso → servicio "n8n" → Domains:  https://n8n.tudominio.com:5678
#  - Todas las ${VARIABLES} aparecen en la pestaña "Environment Variables" de Coolify.
#    Las marcadas con :? son obligatorias. Ninguna clave va escrita acá.
# =============================================================================
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.43.6}
    restart: unless-stopped
    expose:
      - "5678"
    environment:
      # --- URL pública ---
      - N8N_HOST=${N8N_HOST:?n8n.tudominio.com}
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - WEBHOOK_URL=https://${N8N_HOST}/
      - N8N_PROXY_HOPS=1
      # --- Zona horaria argentina (crons de las 08:00 y recordatorios) ---
      - GENERIC_TIMEZONE=America/Argentina/Buenos_Aires
      - TZ=America/Argentina/Buenos_Aires
      # --- Base interna de n8n ---
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-db
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD:?}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?}
      # --- Seguridad / limpieza ---
      - N8N_SECURE_COOKIE=true
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336
      - N8N_RUNNERS_ENABLED=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false   # los workflows leen las claves de estas variables
      # --- Claves que usan los workflows ---
      - USER_NAME=${USER_NAME:-César}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:?}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:?}
      - TELEGRAM_ALLOWED_CHAT_ID=${TELEGRAM_ALLOWED_CHAT_ID:?}
      - GEMINI_API_KEY=${GEMINI_API_KEY:?}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - XAI_API_KEY=${XAI_API_KEY:?}
      - GROK_MODEL=${GROK_MODEL:-grok-4.3}
      - FORZAR_GROK=${FORZAR_GROK:-false}
      - SUPABASE_URL=${SUPABASE_URL:?}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:?}
      - NTFY_URL=https://${NTFY_HOST:?ntfy.tudominio.com}
      - NTFY_TOPIC=${NTFY_TOPIC:-agenda-alertas}
      - NTFY_TOKEN=${NTFY_TOKEN:?}
      - RESEND_API_KEY=${RESEND_API_KEY:?}
      - BRIEFING_EMAIL_FROM=${BRIEFING_EMAIL_FROM:?}
      - BRIEFING_EMAIL_TO=${BRIEFING_EMAIL_TO:?}
      - WEATHER_LAT=${WEATHER_LAT:--33.30}
      - WEATHER_LON=${WEATHER_LON:--66.34}
      - WEATHER_CITY=${WEATHER_CITY:-San Luis}
      - GCAL_SYNC_SECRET=${GCAL_SYNC_SECRET:?}
      - APP_URL=https://${APP_HOST:?app.tudominio.com}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      n8n-db:
        condition: service_healthy

  n8n-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=${N8N_DB_PASSWORD:?}
      - POSTGRES_DB=n8n
    volumes:
      - n8n_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  n8n_data:
  n8n_db:
