# =============================================================================
#  Asistente Ejecutivo Voice-First — stack para el VPS (Ubuntu + Docker)
#
#  Servicios:
#    caddy     → reverse proxy + certificados SSL automáticos (Let's Encrypt)
#    n8n       → orquestador (webhook de Telegram, agente Gemini, crons)
#    n8n-db    → PostgreSQL interno de n8n (workflows, credenciales, ejecuciones)
#    ntfy      → notificaciones push críticas al celular
#    web       → PWA Next.js (agenda)
#
#  Base de datos de negocio (tabla tasks + Realtime): Supabase.
#    - Opción A (recomendada): proyecto en Supabase Cloud.
#    - Opción B: Supabase self-hosted en este mismo VPS (ver docs/SETUP.md §3B).
#
#  Uso:  cp .env.example .env  &&  docker compose up -d --build
# =============================================================================

name: asistente

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - n8n
      - ntfy
      - web

  n8n-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - n8n_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.43.6}
    restart: unless-stopped
    environment:
      # --- URL pública / webhooks ---
      N8N_HOST: n8n.${DOMAIN}
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      WEBHOOK_URL: https://n8n.${DOMAIN}/
      N8N_PROXY_HOPS: 1
      # --- Zona horaria (crons a las 08:00 locales) ---
      GENERIC_TIMEZONE: America/Argentina/San_Luis
      TZ: America/Argentina/San_Luis
      # --- Persistencia ---
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # --- Seguridad / housekeeping ---
      N8N_SECURE_COOKIE: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336        # 14 días
      N8N_RUNNERS_ENABLED: "true"
      # Los nodos Code leen secretos vía $env (ver docs/n8n-design.md)
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # --- Secretos consumidos por los workflows ($env.X) ---
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      TELEGRAM_ALLOWED_CHAT_ID: ${TELEGRAM_ALLOWED_CHAT_ID}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      NTFY_URL: https://ntfy.${DOMAIN}
      NTFY_TOPIC: ${NTFY_TOPIC}
      NTFY_TOKEN: ${NTFY_TOKEN}
      RESEND_API_KEY: ${RESEND_API_KEY}
      BRIEFING_EMAIL_FROM: ${BRIEFING_EMAIL_FROM}
      BRIEFING_EMAIL_TO: ${BRIEFING_EMAIL_TO}
      WEATHER_LAT: ${WEATHER_LAT:--33.30}
      WEATHER_LON: ${WEATHER_LON:--66.34}
      WEATHER_CITY: ${WEATHER_CITY:-San Luis}
      GCAL_SYNC_SECRET: ${GCAL_SYNC_SECRET}
      APP_URL: https://app.${DOMAIN}
      USER_NAME: ${USER_NAME:-César}
    volumes:
      - n8n_data:/home/node/.n8n
      - ../n8n/workflows:/workflows:ro      # para `n8n import:workflow`
    depends_on:
      n8n-db:
        condition: service_healthy

  ntfy:
    image: binwiederhier/ntfy:v2.31.0
    restart: unless-stopped
    command: serve
    environment:
      TZ: America/Argentina/San_Luis
      NTFY_BASE_URL: https://ntfy.${DOMAIN}
      NTFY_BEHIND_PROXY: "true"
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all      # nadie lee/escribe sin token
      NTFY_ATTACHMENT_CACHE_DIR: /var/cache/ntfy/attachments
      NTFY_ENABLE_LOGIN: "true"
      # Necesario para que la app de iOS reciba notificaciones instantáneas
      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
    volumes:
      - ntfy_cache:/var/cache/ntfy
      - ntfy_lib:/var/lib/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3

  web:
    build:
      context: ../web
      args:
        # Variables públicas: se "hornean" en el bundle en tiempo de build
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
        NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
    restart: unless-stopped
    environment:
      TZ: America/Argentina/San_Luis

volumes:
  caddy_data:
  caddy_config:
  n8n_data:
  n8n_db:
  ntfy_cache:
  ntfy_lib:
